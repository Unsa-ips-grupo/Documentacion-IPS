name: Burndown chart automatizado

# Genera el burndown chart cada día a las 06:00 (hora Perú = 11:00 UTC)
# y también se puede correr a mano desde la pestaña Actions.
on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  burndown:
    name: Generar y publicar burndown
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests matplotlib

      - name: Generar el burndown chart
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: python burndown.py

      - name: Publicar la imagen (commit al repo)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add burndown.png
          if git diff --cached --quiet; then
            echo "Sin cambios en el burndown."
          else
            git commit -m "chore: burndown chart actualizado [skip ci]"
            git push
          fi
